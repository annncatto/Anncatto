<main id="main" class="concept-app" data-concept-app>
  <header class="concept-header"><h1><span lang="en">Lightweight Concept Design</span><span lang="zh-CN">轻量化概念设计</span></h1><nav class="concept-architectures" aria-label="Architecture"><button data-architecture="quadruped"><span lang="en">Quadruped</span><span lang="zh-CN">四足</span></button><button data-architecture="biped"><span lang="en">Humanoid</span><span lang="zh-CN">人形</span></button><button data-architecture="arm"><span lang="en">Arm · 6+1</span><span lang="zh-CN">机械臂 · 6+1</span></button></nav><span data-dof class="concept-dof"></span><div class="concept-file-actions"><button data-undo title="Undo">↶</button><button data-redo title="Redo">↷</button><button data-reset><span lang="en">Reset</span><span lang="zh-CN">复位</span></button><button data-reference><span lang="en">Set reference</span><span lang="zh-CN">设为对照</span></button><select data-export aria-label="Export"><option value="">Export</option><option>MJCF</option><option>URDF</option><option>SVG</option><option>DXF</option><option>JSON</option><option>GLB</option><option>PNG</option><option value="POLICY">PPO JSON</option></select><button data-import><span lang="en">Open</span><span lang="zh-CN">导入</span></button><input type="file" data-file hidden accept=".json"></div></header>
  <div class="concept-layout">
    <aside class="concept-design">
      <div class="concept-pane-title"><span lang="en">Design</span><span lang="zh-CN">设计</span><span data-selection></span></div>
      <nav class="concept-tabs" data-design-tabs aria-label="Design parameters"></nav>
      <div class="concept-scope"><select data-part aria-label="Member"></select><select data-scope aria-label="Edit scope"><option value="all">All members</option><option value="part">Selected member</option></select></div>
      <form data-concept-form autocomplete="off"></form>
      <div class="concept-design-status" data-design-status role="status"></div>
    </aside>
    <aside class="concept-analysis"><div class="concept-pane-title"><span lang="en">Comparison</span><span lang="zh-CN">方案比较</span><span data-reference-label></span></div><nav class="concept-metric-tabs" data-metric-tabs aria-label="Analysis"></nav><div data-concept-metrics></div><div class="concept-budget" data-budget></div><div class="concept-limit-checks" data-checks></div></aside>
    <section class="concept-workspace">

      <div class="concept-viewport" data-concept-view><div class="concept-view-label"><span data-model-label></span><span data-simulation-state></span></div><div class="concept-engine-status" data-engine-status></div><div class="concept-tcp" data-tcp></div></div>
      <div class="concept-transport"><select data-task aria-label="Task"><option value="stand">Stand</option><option value="walk">Velocity tracking</option></select><select data-controller aria-label="Controller"><option value="pd">PD + gravity</option><option value="ppo">PPO residual</option></select><button data-run><span lang="en">Run physics</span><span lang="zh-CN">物理运行</span></button><button data-pause><span lang="en">Pause</span><span lang="zh-CN">暂停</span></button><button data-home><span lang="en">Assembly pose</span><span lang="zh-CN">装配姿态</span></button><span data-runtime class="concept-runtime"></span></div>
      <div class="concept-drawing-header"><span lang="en">Engineering views</span><span lang="zh-CN">工程视图</span><div><button data-sheet="assembly"><span lang="en">Assembly</span><span lang="zh-CN">装配</span></button><button data-sheet="part"><span lang="en">Selected member</span><span lang="zh-CN">所选构件</span></button></div></div>
      <div class="concept-drawing" data-drawing></div>
    </section>
  </div>
  <nav class="concept-mobile-tabs" aria-label="Workspace"><button data-mobile="view"><span lang="en">View</span><span lang="zh-CN">视图</span></button><button data-mobile="design"><span lang="en">Design</span><span lang="zh-CN">设计</span></button><button data-mobile="analysis"><span lang="en">Analysis</span><span lang="zh-CN">计算</span></button></nav>
