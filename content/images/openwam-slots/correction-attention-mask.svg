<title id="pathway-mask-title">Grouped video-to-action attention intervention</title>
<desc id="pathway-mask-desc">Thirty paired video and action layers. Only action-query to video-key entries are masked within one selected group of five layers. All other connections retain their original masks.</desc>
<style>.figure-viewer-content>svg[data-pathway-mask]{min-width:1100px}</style>
