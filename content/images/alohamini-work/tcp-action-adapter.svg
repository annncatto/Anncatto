<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Training and execution paths for optional GR00T TCP actions" style="font-family:IBM Plex Sans,Noto Sans SC,sans-serif"><defs><marker id="tcp-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#365f98" stroke-width="1.5"/></marker></defs><text x="40" y="42" text-anchor="start" font-size="31" font-weight="600" fill="#283d50" data-work-diagram-en="Joint records, TCP actions and GR00T N1.7" data-work-diagram-zh="关节记录、末端位姿与 GR00T N1.7">关节记录、末端位姿与 GR00T N1.7</text><text x="40" y="83" text-anchor="start" font-size="24" font-weight="400" fill="#283d50" data-work-diagram-en="Optional tcp / tcp_delta / rotation_6d / tool configuration" data-work-diagram-zh="可选配置：tcp / tcp_delta / rotation_6d / tool">可选配置：tcp / tcp_delta / rotation_6d / tool</text><text x="40" y="144" text-anchor="start" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Training data" data-work-diagram-zh="训练数据">训练数据</text><rect x="40" y="166" width="195" height="88" rx="7" fill="#f2f5f8"/><text x="137.5" y="201" text-anchor="middle" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Recorded fields" data-work-diagram-zh="关节记录">关节记录</text><text x="137.5" y="234" text-anchor="middle" font-size="21" font-weight="400" fill="#283d50">state / action</text><path d="M241 210H270" stroke="#365f98" stroke-width="1.8" marker-end="url(#tcp-flow-arrow)"/><rect x="280" y="166" width="195" height="88" rx="7" fill="#f2f5f8"/><text x="377.5" y="201" text-anchor="middle" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Calibration + FK" data-work-diagram-zh="标定＋正运动学">标定＋正运动学</text><text x="377.5" y="234" text-anchor="middle" font-size="21" font-weight="400" fill="#283d50" data-work-diagram-en="Arm-base · m" data-work-diagram-zh="臂基座系 · m">臂基座系 · m</text><path d="M481 210H510" stroke="#365f98" str