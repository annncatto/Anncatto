width="1.8" marker-end="url(#tcp-flow-arrow)"/><rect x="280" y="354" width="195" height="88" rx="7" fill="#f2f5f8"/><text x="377.5" y="389" text-anchor="middle" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Denormalize" data-work-diagram-zh="反归一化">反归一化</text><text x="377.5" y="422" text-anchor="middle" font-size="21" font-weight="400" fill="#283d50">q01 / q99</text><path d="M481 398H510" stroke="#365f98" stroke-width="1.8" marker-end="url(#tcp-flow-arrow)"/><rect x="520" y="354" width="230" height="88" rx="7" fill="#f2f5f8"/><text x="635.0" y="389" text-anchor="middle" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Restore TCP target" data-work-diagram-zh="还原末端目标">还原末端目标</text><text x="635.0" y="422" text-anchor="middle" font-size="21" font-weight="400" fill="#283d50">T* = Tobs ΔT</text><path d="M756 398H785" stroke="#365f98" stroke-width="1.8" marker-end="url(#tcp-flow-arrow)"/><rect x="795" y="354" width="170" height="88" rx="7" fill="#f2f5f8"/><text x="880.0" y="389" text-anchor="middle" font-size="24" font-weight="600" fill="#283d50" data-work-diagram-en="Continuous IK" data-work-diagram-zh="连续逆运动学">连续逆运动学</text><text x="880.0" y="422" text-anchor="middle" font-size="21" font-weight="400" fill="#283d50" data-work-diagram-en="Limits / reachability" data-work-diagram-zh="限位与可达性">限位与可达性</text><path d="M971 398H995" stroke="#365f98" stroke-width="1.8" marker-end="url(#tcp-flow-arrow)"/><rect x="1005" y="354" width="155" height="88" rx="7" fill="#223b53"/><text x="1082.5" y="389" text-anchor="middle" font-size="24" font-weight="600" fill="#fff" data-work-diagram-en="Host targets" data-work-diagram-zh="Host 目标">Host 目标</text><text x="1082.5" y="422" text-anchor="middle" font-size="21" font-weight="400" fill="#fff" data-work-diagram-en="Joint coordinates" data-work-diagram-zh="关节控制坐标">关节控制坐标</text><text x="40" y="485" text-anchor="start" font-size="28" font-weight="600" fill="#283d50" data-work-diagram-en="ΔT = Tobs⁻¹ Ttarget ;  Ttarget = Tobs ΔT" data-work-diagram-zh="ΔT = Tobs⁻¹ Ttarget；Ttarget = Tobs ΔT">ΔT = Tobs⁻¹ Ttarget；Ttarget = Tobs ΔT</text><text x="40" y="530" text-anchor="start" font-size="23" font-weight="400" fill="#283d50" data-work-diagram-en="6D uses the first two matrix rows; all chunk targets share one anchor." data-work-diagram-zh="6D 旋转取矩阵前两行；整段动作共用当前观测，不逐步累积。">6D 旋转取矩阵前两行；整段动作共用当前观测，不逐步累积。</text><text x="40" y="575" text-anchor="start" font-size="27" font-weight="400" fill="#283d50">q = q₀ + s · 2π(n − n₀) / 4096</text><text x="630" y="575" text-anchor="start" font-size="21" font-weight="400" fill="#283d50" data-work-diagram-en="n₀/q₀: reference; q in rad; s = ±1." data-work-diagram-zh="n₀/q₀：标定参考；q：rad；s = ±1。">n₀/q₀：标定参考；q：rad；s = ±1。</text><text x="40" y="621" text-anchor="start" font-size="21" font-weight="400" fill="#283d50" data-work-diagram-en="T₀: arm base; TF: final joint to fixed jaw." data-work-diagram-zh="T₀：臂基座；TF：末关节→固定夹爪。">T₀：臂基座；TF：末关节→固定夹爪。</text><text x="630" y="621" text-anchor="start" font-size="21" font-weight="400" fill="#283d50" data-work-diagram-en="Absolute gripper/base/lift targets; no arm IK." data-work-diagram-zh="夹爪、底盘、升降保留绝对目标，不参与手臂 IK。">夹爪、底盘、升降保留绝对目标，不参与手臂 IK。</text><text x="40" y="667" text-anchor="start" font-size="23" font-weight="600" fill="#2d7c68" data-work-diagram-en="GR00T defaults to recorded actions; TCP is an optional shared data transform." data-work-diagram-zh="GR00T 默认使用记录动作；末端表示由共享数据层按配置转换。">GR00T 默认使用记录动作；末端表示由共享数据层按配置转换。</text></svg>