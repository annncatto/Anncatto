<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="770" viewBox="0 0 1260 770" role="img" aria-labelledby="title"><title id="title">LIBERO-Plus: camera/noise robustness, data coverage and prediction targets</title><rect width="1260" height="770" fill="white"/><g font-family="IBM Plex Sans,Noto Sans SC,sans-serif" fill="#273b43"><text x="20" y="36" font-size="28" font-weight="600" fill="#273b43">LIBERO-Plus：评测协议、数据覆盖与预测目标</text><text x="20" y="72" font-size="21" font-weight="400" fill="#273b43">α 使用 LIBERO 微调检查点直接评测 Plus；同一评测基准不等于所有模型使用相同训练数据。</text><rect x="20" y="95" width="1220" height="45" rx="7" fill="#eff5f5" stroke="#d4e1e1"/><text x="35" y="125" font-size="21" font-weight="600" fill="#273b43">Model</text><text x="320" y="125" font-size="21" font-weight="600" fill="#273b43">Camera (%)</text><text x="530" y="125" font-size="21" font-weight="600" fill="#273b43">Noise (%)</text><text x="730" y="125" font-size="21" font-weight="600" fill="#273b43">Prediction target / 预测目标</text><rect x="20" y="140" width="1220" height="45" rx="7" fill="#edf6f2" stroke="#d4e1e1"/><text x="35" y="169" font-size="20" font-weight="600" fill="#273b43">OpenWAM-α</text><text x="320" y="169" font-size="20" font-weight="600" fill="#273b43">33.8</text><text x="530" y="169" font-size="20" font-weight="600" fill="#273b43">39.8</text><text x="730" y="169" font-size="20" font-weight="600" fill="#273b43">多帧像素潜变量 / multi-frame pixel latents</text><rect x="20" y="185" width="1220" height="45" rx="7" fill="#ffffff" stroke="#d4e1e1"/><text x="35" y="214" font-size="20" font-weight="400" fill="#273b43">π0.5</text><text x="320" y="214" font-size="20" font-weight="400" fill="#273b43">78.4</text><text x="530" y="214" font-size="20" font-weight="400" fill="#273b43">89.0</text><text x="730" y="214" font-size="20" font-weight="400" fill="#273b43">动作预测 / action prediction</text><rect x="20" y="230" width="1220" height="45" rx="7" fill="#ffffff" stroke="#d4e1e1"/><text x="35" y="259" font-size="20" font-weight="400" fill="#273b43">Being-H0.7</text><text x="320" y="259" font-size="20" font-weight="400" fill="#273b43">82.0</text><text x="530" y="259" font-size="20" font-weight="400" fill="#273b43">93.5</text><text x="730" y="259" font-size="20" font-weight="400" fill="#273b43">V-JEPA 视觉表征 / visual representations</text><rect x="20" y="275" width="1220" height="45" rx="7" fill="#ffffff" stroke="#d4e1e1"/><text x="35" y="304" font-size="20" font-weight="400" fill="#273b43">ImageWAM</text><text x="320" y="304" font-size="20" font-weight="400" fill="#273b43">80.8</text><text x="530" y="304" font-size="20" font-weight="400" fill="#273b43">93.8</text><text x="730" y="304" font-size="20" font-weight="400" fill="#273b43">单幅未来图像 / single future image</text><rect x="20" y="320" width="1220" height="45" rx="7" fill="#ffffff" stroke="#d4e1e1"/><text x="35" y="349" font-size="20" font-weight="400" fill="#273b43">ABot-M0.5</text><text x="320" y="349" font-size="20" font-weight="400" fill="#273b43">70.5</text><text x="530" y="349" font-size="20" font-weight="400" fill="#273b43">75.5</text><text x="730" y="349" font-size="20" font-weight="400" fill="#273b43">多帧像素潜变量 / multi-frame pixel latents</text><rect x="20" y="390" width="1220" height="95" rx="7" fill="#f3f7f6" stroke="#d4e1e1"/><text x="38" y="420" font-size="22" font-weight="600" fill="#273b43">作者的数据解释 / Pretraining coverage</text><text x="38" y="451" font-size="20" font-weight="400" fill="#273b43">α 的单臂预训练主要来自 DROID 与 InternData-A1 单臂数据（1,100+ h）；本体、场景和视角多样性有限。</text><rect x="20" y="500" width="1220" height="95" rx="7" fill="#f1f6fa" stroke="#d4e1e1"/><text x="38" y="530" font-size="22" font-weight="600" fill="#273b43">作者的架构解释 / Representation and prediction horizon</text><text x="38" y="561" font-size="20" font-weight="400" fill="#273b43">视角或噪声变化影响像素潜变量；多帧预测还可能累积误差。语义表征、单帧预测与更丰富数据是比较维度。</text><rect x="20" y="610" width="1220" height="100" rx="7" fill="#f3f7f6" stroke="#d4e1e1"/><text x="38" y="640" font-size="22" font-weight="600" fill="#273b43">结果范围 / Scope of evidence</text><text x="38" y="671" font-size="20" font-weight="400" fill="#273b43">表中模型同时存在预训练、架构与训练设置差异；这些结果支持分析具体脆弱性，未单独隔离每项原因。</text><text x="20" y="748" font-size="17" font-weight="400" fill="#273b43">OpenWAM §5.3.1–5.3.2, Table 5; Appendix B.2 · LIBERO-Plus benchmark</text></g></svg>