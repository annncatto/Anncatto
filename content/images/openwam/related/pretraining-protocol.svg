<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660" role="img" aria-labelledby="title desc"><title id="title">Embodied pretraining and downstream adaptation</title><desc id="desc">The same initial WAM is compared without embodied pretraining, with 600 hours of RoboCOIN, with 350 hours EgoDex followed by 250 hours RoboCOIN, or with a joint 600-hour mixture. Every variant then receives the same RoboTwin target-task fine-tuning. The Clean2Random protocol fine-tunes on Clean and evaluates on Clean and Randomized.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1260" height="660" fill="white"/><g font-family="IBM Plex Sans,Noto Sans SC,sans-serif" fill="#273b43"><text x="630" y="32" text-anchor="middle" font-size="24"><tspan x="630" dy="0">具身预训练 → 下游任务微调 → 评测 / Embodied pretraining → task adaptation → evaluation</tspan></text><text x="630" y="72" text-anchor="middle" font-size="18"><tspan x="630" dy="0">通用视频生成先验提供初始化；本对照改变具身预训练方案。</tspan><tspan x="630" dy="23.400000000000002">All variants share the video-generative initialization; embodied pretraining varies.</tspan></text><rect x="10" y="140" width="280" height="65" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="150.0" y="166.8" text-anchor="middle" font-size="18"><tspan x="150.0" dy="0">不做具身预训练</tspan><tspan x="150.0" dy="23.400000000000002">No embodied pretraining</tspan></text><rect x="10" y="230" width="280" height="65" rx="9" fill="#edf5fa" stroke="#a7cadd" stroke-width="1.5"/><text x="150.0" y="256.8" text-anchor="middle" font-size="18"><tspan x="150.0" dy="0">RoboCOIN · 600 h</tspan><tspan x="150.0" dy="23.400000000000002">Robot-only pretraining</tspan></text><rect x="10" y="320" width="280" height="65" rx="9" fill="#edf5fa" stroke="#a7cadd" stroke-width="1.5"/><text x="150.0" y="346.8" text-anchor="middle" font-size="18"><tspan x="150.0" dy="0">EgoDex · 350 h</tspan><tspan x="150.0" dy="23.400000000000002">Human egocentric pretraining</tspan></text><rect x="350" y="320" width="250" height="65" rx="9" fill="#edf5fa" stroke="#a7cadd" stroke-width="1.5"/><text x="475.0" y="346.8" text-anchor="middle" font-size="18"><tspan x="475.0" dy="0">RoboCOIN · 250 h</tspan><tspan x="475.0" dy="23.400000000000002">Then robot pretraining</tspan></text><rect x="10" y="410" width="590" height="65" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="305.0" y="436.8" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0">EgoDex 350 h + RoboCOIN 250 h</tspan><tspan x="305.0" dy="23.400000000000002">单阶段混合 / Joint co-training</tspan></text><path d="M300 352H340" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 172H665" fill="none" stroke="#237ab2" stroke-width="2.5"/><path d="M300 262H665" fill="none" stroke="#237ab2" stroke-width="2.5"/><path d="M610 352H665" fill="none" stroke="#237ab2" stroke-width="2.5"/><path d="M610 442H665" fill="none" stroke="#237ab2" stroke-width="2.5"/><path d="M665 172V442" fill="none" stroke="#237ab2" stroke-width="2.5"/><path d="M665 315H720" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="250" width="240" height="130" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="850.0" y="285.9" text-anchor="middle" font-size="18"><tspan x="850.0" dy="0">RoboTwin · Clean 示教</tspan><tspan x="850.0" dy="23.400000000000002">相同目标任务与训练设置</tspan><tspan x="850.0" dy="23.400000000000002">Same downstream</tspan><tspan x="850.0" dy="23.400000000000002">fine-tuning</tspan></text><path d="M980 290H995V247H1010" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 340H995V387H1010" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1020" y="210" width="230" height="75" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="1135.0" y="241.8" text-anchor="middle" font-size="18"><tspan x="1135.0" dy="0">Clean 评测 / Test</tspan><tspan x="1135.0" dy="23.400000000000002">ID</tspan></text><rect x="1020" y="350" width="230" height="75" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="1135.0" y="381.8" text-anchor="middle" font-size="18"><tspan x="1135.0" dy="0">Randomized 评测</tspan><tspan x="1135.0" dy="23.400000000000002">OOD</tspan></text><rect x="10" y="525" width="600" height="85" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="310.0" y="561.8" text-anchor="middle" font-size="18"><tspan x="310.0" dy="0">EgoDex：人类第一视角操作与手部运动标注</tspan><tspan x="310.0" dy="23.400000000000002">Human egocentric manipulation and hand motion</tspan></text><rect x="635" y="525" width="615" height="85" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="942.5" y="561.8" text-anchor="middle" font-size="18"><tspan x="942.5" dy="0">RoboCOIN：真实多机器人双臂操作轨迹</tspan><tspan x="942.5" dy="23.400000000000002">Real multi-robot bimanual demonstrations</tspan></text><text x="630" y="642" text-anchor="middle" font-size="17"><tspan x="630" dy="0">图示为 Clean2Random；Full 协议则用完整 RoboTwin 训练集微调。</tspan></text></g></svg>