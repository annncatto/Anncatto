<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="390" viewBox="0 0 1260 390" role="img" aria-labelledby="title desc"><title id="title">Semantic VAE (S-VAE) in OpenWAM</title><desc id="desc">High-dimensional frozen visual features are encoded into a 48-channel Gaussian latent and decoded for semantic reconstruction with KL regularization. After standalone training the frozen encoder supplies its posterior mean to the world DiT; the semantic decoder is used for S-VAE training.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1260" height="390" fill="white"/><g font-family="IBM Plex Sans, Noto Sans SC, sans-serif" fill="#273b43"><text x="630" y="30" text-anchor="middle" font-size="24"><tspan x="630" dy="0">S-VAE · 语义特征压缩与重建 / Semantic feature compression and reconstruction</tspan></text><rect x="10" y="65" width="190" height="115" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="105.0" y="105.1" text-anchor="middle" font-size="18"><tspan x="105.0" dy="0">语义特征 h</tspan><tspan x="105.0" dy="23.400000000000002">Semantic features</tspan><tspan x="105.0" dy="23.400000000000002">DINOv3 / V-JEPA</tspan></text><rect x="260" y="65" width="250" height="115" rx="9" fill="#edf5fa" stroke="#a7cadd" stroke-width="1.5"/><text x="385.0" y="105.1" text-anchor="middle" font-size="18"><tspan x="385.0" dy="0">编码器 Eₛ</tspan><tspan x="385.0" dy="23.400000000000002">3 × Transformer</tspan><tspan x="385.0" dy="23.400000000000002">μ, log σ²</tspan></text><rect x="570" y="65" width="140" height="115" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="640.0" y="105.1" text-anchor="middle" font-size="18"><tspan x="640.0" dy="0">紧凑潜变量</tspan><tspan x="640.0" dy="23.400000000000002">Compact z</tspan><tspan x="640.0" dy="23.400000000000002">48 channels</tspan></text><rect x="770" y="65" width="250" height="115" rx="9" fill="#edf5fa" stroke="#a7cadd" stroke-width="1.5"/><text x="895.0" y="105.1" text-anchor="middle" font-size="18"><tspan x="895.0" dy="0">解码器 Dₛ</tspan><tspan x="895.0" dy="23.400000000000002">Projection +</tspan><tspan x="895.0" dy="23.400000000000002">3 × Transformer</tspan></text><rect x="1080" y="65" width="170" height="115" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="1165.0" y="116.8" text-anchor="middle" font-size="18"><tspan x="1165.0" dy="0">重建特征 ĥ</tspan><tspan x="1165.0" dy="23.400000000000002">Reconstructed h</tspan></text><path d="M210 122H250" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 122H560" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 122H760" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1030 122H1070" fill="none" stroke="#237ab2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="10" y="255" width="430" height="105" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="225.0" y="290.1" text-anchor="middle" font-size="18"><tspan x="225.0" dy="0">S-VAE 独立训练 / Standalone training</tspan><tspan x="225.0" dy="23.400000000000002">语义特征重建 + KL 正则</tspan><tspan x="225.0" dy="23.400000000000002">MSE + cosine loss + β KL</tspan></text><rect x="525" y="255" width="230" height="105" rx="9" fill="#edf6f2" stroke="#a7cdbd" stroke-width="1.5"/><text x="640.0" y="290.1" text-anchor="middle" font-size="18"><tspan x="640.0" dy="0">WAM 世界流</tspan><tspan x="640.0" dy="23.400000000000002">World DiT</tspan><tspan x="640.0" dy="23.400000000000002">使用后验均值 μ</tspan></text><path d="M640 190V245" fill="none" stroke="#4b9c80" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="820" y="255" width="430" height="105" rx="9" fill="#f1f4f4" stroke="#c4d2d4" stroke-width="1.5"/><text x="1035.0" y="290.1" text-anchor="middle" font-size="18"><tspan x="1035.0" dy="0">独立训练后冻结 S-VAE</tspan><tspan x="1035.0" dy="23.400000000000002">Freeze S-VAE after standalone training</tspan><tspan x="1035.0" dy="23.400000000000002">Decoder: S-VAE training only</tspan></text><text x="950" y="217" text-anchor="middle" font-size="18"><tspan x="950" dy="0">保留时间与空间网格 / Preserve T, H, W</tspan></text></g></svg>