<title id="smol-swap-title">SmolVLA trained modules, sampling, and parameter swaps</title><desc id="smol-swap-desc">Frozen vision-language prefix, trainable state/action/time projections and a sixteen-layer expert. Memory-only module swaps use identical FP32 replay. The sampler integrates 32 dimensions; loss supervises 18.</desc><style>.figure-viewer-content>svg[data-smol-intervention]{min-width:1100px}</style><defs>
